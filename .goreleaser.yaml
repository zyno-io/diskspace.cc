# SPDX-License-Identifier: MIT
# Adapted from github.com/zyno-io/sp2p (MIT)
version: 2

# The embedded web SPA must exist before any Go build.
before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: diskspace
    main: ./cmd/diskspace
    binary: diskspace
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.defaultRelay=https://diskspace.cc

  - id: diskspace-relay
    main: ./cmd/diskspace-relay
    binary: diskspace-relay
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # Names carry no version so /releases/latest/download/<name> works.
  - id: diskspace
    ids: [diskspace]
    formats: [tar.gz]
    name_template: "diskspace_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: diskspace-relay
    ids: [diskspace-relay]
    formats: [tar.gz]
    name_template: "diskspace-relay_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: diskspace
    ids: [diskspace]
    package_name: diskspace
    homepage: https://diskspace.cc
    maintainer: Zyno Consulting <oss@zyno.io>
    description: Disk usage explorer you view in your browser, on any machine you can run a command on
    license: MIT
    file_name_template: "diskspace_{{ .Arch }}"
    formats: [deb, rpm, apk]
    bindir: /usr/bin

dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    ids: [diskspace-relay]
    images:
      - "ghcr.io/zyno-io/diskspace-relay"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: zyno-io
    name: diskspace.cc
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

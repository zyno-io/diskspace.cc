# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The CLI, relay and desktop app embed web/dist.
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      # The desktop app has no Linux build (it would need GTK/WebKit headers).
      - name: List packages
        id: pkgs
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo "list=$(go list ./... | grep -v '/gui$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "list=./..." >> "$GITHUB_OUTPUT"
          fi
      - run: go vet ${{ steps.pkgs.outputs.list }}
      - run: go test -race -count=1 ${{ steps.pkgs.outputs.list }}
        env:
          DISKSPACE_PWSH_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '' }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, test, build
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI and relay
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath ./cmd/diskspace
          go build -trimpath ./cmd/diskspace-relay

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint scripts/*.sh
        run: shellcheck scripts/*.sh
      - name: Lint the generated bootstrap script
        run: SHELLCHECK=1 go test -count=1 -run TestRenderedScriptShellcheck -v ./internal/relay/

  # Hermetic: builds the sidecar and drives it with a fake docker command; no
  # Docker socket is mounted and nothing touches production.
  deploy-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint deploy scripts
        run: shellcheck deploy/webhook/*.sh
      - name: Build deployment sidecar
        run: docker build -t diskspace-deploy-hook:test deploy/webhook
      - name: Check signed HTTPS requests and fixed deployment command
        run: python3 deploy/webhook/test_webhook.py
